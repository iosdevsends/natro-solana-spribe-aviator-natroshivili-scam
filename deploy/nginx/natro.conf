# Drop this in /etc/nginx/sites-available/natro.conf (Ubuntu) or
# /etc/nginx/conf.d/natro.conf (Amazon Linux) and enable.
# Production domain: natro.meme — verified in Google Search Console via
# Cloudflare DNS (domain-wide). Sitemap: https://natro.meme/sitemap.xml.
# TLS: certbot --nginx -d natro.meme once the A record points here.
# (Cloudflare proxying: set SSL/TLS mode to "Full (strict)" in CF dashboard.)

upstream natro_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream natro_backend {
    server 127.0.0.1:1337;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name natro.meme;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name natro.meme;

    ssl_certificate     /etc/letsencrypt/live/natro.meme/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/natro.meme/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 60M;       # large enough for screenshot uploads via Strapi admin
    proxy_read_timeout 90s;

    # Strapi admin and API live under /admin and /api
    location ~ ^/(admin|api|uploads|content-manager|content-type-builder|users-permissions|i18n|email|upload) {
        proxy_pass http://natro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://natro_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
