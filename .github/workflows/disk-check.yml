name: Disk check

# READ-ONLY diagnostic. SSHes into the production host with the same deploy
# key the Deploy workflow uses and prints disk / docker usage. Deletes nothing.
# Runs automatically when this file is pushed (path filter), or on manual
# dispatch. Safe to delete once the disk question is answered.
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/disk-check.yml'

jobs:
  disk-check:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_HOST_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Report disk usage (READ-ONLY — deletes nothing)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e
             echo "=== df -h / ==="; df -h /
             echo "=== df -i / (inodes) ==="; df -i /
             echo "=== docker system df ==="; docker system df
             echo "=== docker system df -v (top images + build cache) ==="; docker system df -v | head -100'
