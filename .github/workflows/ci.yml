name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint . --max-warnings=0
        continue-on-error: true
      - name: Build
        env:
          NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Strapi build
        env:
          NODE_ENV: production
          APP_KEYS: ${{ secrets.APP_KEYS || 'ci_a,ci_b,ci_c,ci_d' }}
          API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT || 'ci_salt' }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET || 'ci_admin_jwt' }}
          TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT || 'ci_transfer' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_jwt' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'ci_enc' }}
          DATABASE_CLIENT: sqlite
          DATABASE_FILENAME: .tmp/data.db
        run: npm run build
