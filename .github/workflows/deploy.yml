name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Full sequential Docker rebuild (backend then frontend) on the small
    # shared host runs ~18 min cold but exceeds 25 min when the previous stack
    # is already resident (less free RAM → slower build), so the job was being
    # cancelled before `docker compose up -d` and new images never went live.
    timeout-minutes: 45
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_HOST_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull latest, rebuild, restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             cd $DEPLOY_PATH
             # Free disk FIRST — with the 24G root at 100%, even 'git fetch'
             # fails ('unable to write loose object file: No space left'), so
             # clean up BEFORE touching git. photovideo was moved off this host,
             # so the only running stack is natro (frontend, backend, postgres).
             # system prune -af (NO --volumes) drops stopped containers,
             # unused/dangling images (incl. stale photovideo leftovers) and all
             # build cache, while keeping running natro containers, their in-use
             # images, and every named volume (postgres data, uploads).
             echo "Disk before cleanup:"; df -h /
             docker system prune -af
             echo "Disk after cleanup:"; df -h /
             git fetch --all --prune
             git reset --hard origin/main
             # Build services SEQUENTIALLY to avoid OOM on t3.small.
             # Backend (Strapi admin) is the memory-heavy one — go first.
             docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml build --pull backend
             docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml build --pull frontend
             docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
             sleep 5
             docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml ps
             docker image prune -f"

      - name: Checkout (for IndexNow script)
        uses: actions/checkout@v4

      - name: Smoke test
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || 'https://natro.meme' }}
        run: |
          set -e
          for path in / /robots.txt /sitemap.xml /ru /privacy; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${PUBLIC_URL}${path}" || echo "000")
            echo "${PUBLIC_URL}${path} → ${code}"
            if [ "${code:0:1}" != "2" ] && [ "${code:0:1}" != "3" ]; then
              echo "❌ ${path} returned ${code}"
              exit 1
            fi
          done

      - name: Ping IndexNow (Bing + Yandex + Yep)
        if: success()
        continue-on-error: true
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || 'https://natro.meme' }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || 'a28fa24b302f5e5a7dd9d9014798221f' }}
        run: bash scripts/ping-indexnow.sh
