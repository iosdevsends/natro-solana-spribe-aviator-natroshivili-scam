name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_HOST_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull latest, rebuild, restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             cd $DEPLOY_PATH
             git fetch --all --prune
             git reset --hard origin/main
             docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml build --pull
             docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
             sleep 5
             docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml ps
             docker image prune -f"

      - name: Smoke test
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || 'https://natro.meme' }}
        run: |
          set -e
          for path in / /robots.txt /sitemap.xml /ru /privacy; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${PUBLIC_URL}${path}" || echo "000")
            echo "${PUBLIC_URL}${path} → ${code}"
            if [ "${code:0:1}" != "2" ] && [ "${code:0:1}" != "3" ]; then
              echo "❌ ${path} returned ${code}"
              exit 1
            fi
          done
