name: natro

services:
  postgres:
    image: postgres:16-alpine
    container_name: natro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-natro}
      POSTGRES_USER: ${POSTGRES_USER:-natro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_natro_pg}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-natro} -d ${POSTGRES_DB:-natro}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - natro-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: natro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-natro}
      DATABASE_USERNAME: ${POSTGRES_USER:-natro}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_natro_pg}
      DATABASE_SSL: "false"
      PUBLIC_URL: ${PUBLIC_STRAPI_URL:-http://localhost:1337}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - natro-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: natro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL:-http://localhost:1337}
      STRAPI_INTERNAL_URL: http://backend:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
      NEXT_PUBLIC_LOCALES: ${NEXT_PUBLIC_LOCALES:-en,ru,ka,fr,de,es}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    networks:
      - natro-net

volumes:
  postgres_data:
  backend_node_modules:
  backend_uploads:
  frontend_node_modules:
  frontend_next:

networks:
  natro-net:
    driver: bridge
