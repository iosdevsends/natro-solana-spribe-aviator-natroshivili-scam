name: natro

# Production overrides for shared-host deployment alongside photovideo.ae.
# Host ports remapped to avoid collisions with the existing project:
#   3001 → frontend (photovideo uses 3000)
#   1338 → strapi   (photovideo uses 1337)
#   5434 → postgres (photovideo postgres is internal-only on 5432; we expose
#                    a different host port for occasional psql sessions)

services:
  postgres:
    ports: !override
      - "127.0.0.1:5434:5432"   # localhost-only, no public exposure
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    image: natro-backend:local
    volumes: !override
      - backend_uploads:/app/public/uploads
    environment:
      NODE_ENV: production
    ports: !override
      - "127.0.0.1:1338:1337"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL:-https://natro.meme}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_FRONTEND_URL:-https://natro.meme}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
        NEXT_PUBLIC_LOCALES: ${NEXT_PUBLIC_LOCALES:-en,ru,uk,ka,fr,de,es}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_TURNSTILE_SITEKEY: ${NEXT_PUBLIC_TURNSTILE_SITEKEY:-}
    image: natro-frontend:local
    volumes: !reset []
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
      STRAPI_INTERNAL_URL: http://backend:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_FRONTEND_URL}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
      # Comment wall (/reputation): editor passphrase for /admin/comments, salt
      # for the one-way commenter-IP hash, and the server-side Turnstile secret
      # so CAPTCHA is actually verified (the public sitekey is already a build arg).
      MODERATION_SECRET: ${MODERATION_SECRET:-}
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    ports: !override
      - "127.0.0.1:3001:3000"
    restart: always

volumes:
  backend_uploads:
